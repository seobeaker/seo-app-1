# Local: docker compose up --build  ->  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
